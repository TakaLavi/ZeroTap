name: Build ZeroTap APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        if: success()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/ZeroTap.apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ZeroTap-debug-apk
          path: out/ZeroTap.apk
          if-no-files-found: error

      - name: Publish to "latest" release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ZeroTap (latest build)
          body: |
            Automated debug build of ZeroTap — autonomous phone agent (Android 15 / API 35).
            Install the attached `ZeroTap.apk`, then add your MiMo API key in Settings and
            enable the accessibility service.
          files: out/ZeroTap.apk
          fail_on_unmatched_files: true
